<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPL Predict 🏏</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>" />
</head>
<body>

<!-- ── Header ──────────────────────────────────────── -->
<header>
  <div class="logo">
    <span class="trophy">🏆</span>
    IPL Predict
  </div>
  <div id="auth-area">
    <!-- populated by app.js -->
  </div>
</header>

<!-- ── Nav Tabs ────────────────────────────────────── -->
<nav>
  <button class="tab-btn active" data-tab="tab-matches">🏏 Matches</button>
  <button class="tab-btn"        data-tab="tab-history">📋 My Predictions</button>
  <button class="tab-btn"        data-tab="tab-leaderboard">🏅 Leaderboard</button>
</nav>

<!-- ── Auth Gate (shown when not logged in) ────────── -->
<div id="auth-gate" style="display:none">
  <div class="empty-state" style="padding:5rem 1rem">
    <div class="icon">🏆</div>
    <h2 style="font-size:1.8rem;color:#1a237e;margin-bottom:.4rem">IPL Predict</h2>
    <p style="color:#757575;margin-bottom:2rem">Sign in to submit predictions, track your score, and compete on the leaderboard.</p>
    <div class="auth-buttons">
      <button class="btn btn-google" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:middle">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <button class="btn btn-magic" id="btn-magic">✉️ Magic Link</button>
    </div>
    <div id="magic-email-form">
      <input type="email" id="magic-email" placeholder="your@email.com" autocomplete="email" />
      <button class="btn btn-primary" id="btn-send-magic">Send Magic Link</button>
    </div>
  </div>
</div>

<!-- ── App Content (hidden until signed in) ────────── -->
<div id="app-content" style="display:none">
  <main>

    <!-- ── Matches Tab ─────────────────────────────── -->
    <div id="tab-matches" class="tab-panel active">

      <!-- Booster Banner -->
      <div class="booster-info">
        <span class="icon">🚀</span>
        <span id="booster-badge">Double Boosters remaining: 3 / 3</span>
        <span style="margin-left:auto;font-size:.78rem;color:#795548">
          Doubles your points — use wisely!
        </span>
      </div>

      <!-- Upcoming Matches -->
      <div class="section-title">Upcoming Matches</div>
      <div id="upcoming-matches" class="matches-grid">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>

      <!-- Completed Matches -->
      <div class="section-title" style="margin-top:2rem">Completed Matches</div>
      <div id="resulted-matches" class="matches-grid"></div>

    </div><!-- /tab-matches -->

    <!-- ── History Tab ─────────────────────────────── -->
    <div id="tab-history" class="tab-panel">
      <div class="section-title">My Prediction History</div>
      <div id="history-list" class="history-list">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div><!-- /tab-history -->

    <!-- ── Leaderboard Tab ─────────────────────────── -->
    <div id="tab-leaderboard" class="tab-panel">
      <div class="section-title">
        Leaderboard
        <span class="live-badge">
          <span class="live-dot"></span> LIVE
        </span>
      </div>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>Points</th>
            <th>Predictions</th>
            <th>Correct</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr>
            <td colspan="5" style="text-align:center;padding:2rem">
              <div class="spinner" style="margin:auto"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div><!-- /tab-leaderboard -->

  </main>
</div><!-- /app-content -->

<!-- ── Toast Container ─────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── Scripts ─────────────────────────────────────── -->
<!-- Supabase JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Project config — update supabase-config.js with your real keys -->
<script src="supabase-config.js"></script>
<!-- App logic -->
<script src="app.js"></script>

</body>
</html>
